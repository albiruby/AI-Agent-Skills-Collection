name: Validate frontmatter

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SKILL.md frontmatter
        shell: pwsh
        run: ./.github/scripts/validate-frontmatter.ps1
